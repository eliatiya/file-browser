<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>File Browser</title>
    <link rel="stylesheet" href="src/styles/tokens.css">
    <link rel="stylesheet" href="src/styles/app.css">
    <script type="module" src="src/ui/main.js"></script>
  </head>
  <body>
    <header class="toolbar">
      <button type="button" id="choose-folder">Choose folder</button>
      <p id="status" class="status" role="status"></p>
    </header>
    <main id="app" class="layout">
      <nav class="tree-pane" aria-label="Folder tree">
        <div id="tree" role="tree" aria-label="Files"></div>
      </nav>
      <section class="detail-pane" aria-label="Details">
        <div id="details"></div>
      </section>
    </main>
  </body>
</html>
